# Production frontend for auction.aimcup.xyz. Published on host port 3100 -> container 3000.
# The API origin is a public, build-time value (baked into the bundle), so it is set here directly.
services:
  aimcup-auction-frontend:
    container_name: aimcup-auction-frontend
    build:
      context: .
      dockerfile: ./build.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://auction-api.aimcup.xyz
    restart: always
    ports:
      - "3100:3000"
    networks:
      - default

networks:
  default:
    external: true
    name: aimcup-network
