# Test ("next") frontend for next.auction.aimcup.xyz. Published on host port 3101 -> container 3000.
services:
  aimcup-auction-frontend-next:
    container_name: aimcup-auction-frontend-next
    build:
      context: .
      dockerfile: ./build.next.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://next.api.auction.aimcup.xyz
    restart: always
    ports:
      - "3101:3000"
    networks:
      - default

networks:
  default:
    external: true
    name: aimcup-network
